spring.application.name=mishone

# Conexion a Postgres (Supabase). Configurar como variables de entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Crea/actualiza las tablas automaticamente a partir de las entidades.
# Si el esquema ya existe en Supabase con datos migrados, cambiar a "validate".
spring.jpa.hibernate.ddl-auto=update
